<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物安全防丢系统</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f6f8; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 30px; max-width: 400px; margin: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .pet-pic { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; }
        .btn { display: block; width: 100%; padding: 15px; border-radius: 50px; text-decoration: none; font-weight: bold; margin-top: 15px; border: none; cursor: pointer; }
        .phone-btn { background: #2ecc71; color: white; }
        .loc-btn { background: #3498db; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <img id="petPic" class="pet-pic" src="" alt="宠物照片">
        <h1 id="petName">加载中...</h1>
        <a id="phoneBtn" class="btn phone-btn" href="#">拨打主人电话</a>
        <button id="locBtn" class="btn loc-btn" onclick="sendLocation()">获取并发送当前位置</button>
        <p id="status" style="font-size: 12px; color: #999; margin-top: 20px;"></p>
    </div>

<script>
    const petId = new URLSearchParams(window.location.search).get('id');
    let pet = null;

    window.onload = () => {
        fetch('data.json?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                pet = data[petId];
                if (pet) {
                    document.getElementById('petName').innerText = "我是 " + pet.name;
                    document.getElementById('petPic').src = pet.photo;
                    document.getElementById('phoneBtn').href = "tel:" + pet.phone;
                }
            });
    };

    function sendLocation() {
        if (!pet || !pet.pushKey) return;
        const btn = document.getElementById('locBtn');
        btn.innerText = "定位中...";

        navigator.geolocation.getCurrentPosition(pos => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const mapUrl = `https://uri.amap.com/marker?position=${lon},${lat}&name=扫描位置`;
            const pushUrl = `https://api2.pushdeer.com/message/push?pushkey=${pet.pushKey}&text=发现宠物位置&desp=经纬度:${lat},${lon}，点击查看地图: ${mapUrl}`;
            
            fetch(pushUrl).then(() => {
                btn.innerText = "位置已发送给主人！";
                btn.disabled = true;
            });
        }, () => {
            btn.innerText = "请允许访问位置权限";
        });
    }
</script>
</body>
</html>
