<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物安全防丢系统</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #fcfbf7; padding: 20px; color: #333; margin: 0; }
        .card { background: #fffdf9; border-radius: 30px; padding: 30px; max-width: 400px; margin: 20px auto; box-shadow: 0 10px 40px rgba(0,0,0,0.06); border: 1px solid #f0eee9; }
        .pet-pic { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #e2e8f0; margin-bottom: 20px; }
        h1 { font-size: 26px; color: #2d3436; margin: 10px 0; }
        .btn { display: block; width: 100%; padding: 16px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 16px; border: none; cursor: pointer; margin-top: 15px; }
        .phone-btn { background: #6b8e23; color: white; }
        .loc-btn { background: #4a90e2; color: white; }
        #status { font-size: 12px; color: #999; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <img id="petPic" class="pet-pic" src="" alt="宠物照片">
        <h1 id="petName">我是阿布 🐶</h1>
        <p id="msgText">如果您看到了这个页面，说明我可能迷路了。<br>请帮我联系主人！SOS ⚠️</p>
        
        <a id="phoneBtn" class="btn phone-btn" href="#">拨打主人电话</a>
        <button id="locBtn" class="btn loc-btn" onclick="sendLocation()">📍 点击将我的位置发给主人</button>
        
        <p id="status">💡 提示：本铭牌尚未配置 Bark 远端实时报警。</p>
    </div>

<script>
    const petId = new URLSearchParams(window.location.search).get('id') || "SGB001";
    let petData = null; // 初始化为空，防止崩溃

    // 1. 核心修复：数据加载逻辑
    window.onload = function() {
        // 先让界面显示，哪怕数据慢，也不会白屏
        renderLoadingState(); 

        fetch('data.json?nocache=' + Date.now())
            .then(res => res.json())
            .then(data => {
                petData = data[petId]; // 赋值给全局变量
                if (petData) {
                    renderPetInfo(petData);
                    sendScanNotification(petData); // 加载完成即触发静默扫码推送
                } else {
                    document.getElementById('status').innerText = "⚠️ 错误：未找到该元件 ID！";
                }
            })
            .catch(err => {
                document.getElementById('status').innerText = "❌ 读取错误：请检查 data.json 格式";
            });
    };

    function renderLoadingState() {
        document.getElementById('petName').innerText = "载入中...";
    }

    function renderPetInfo(data) {
        document.getElementById('petName').innerText = "我是 " + data.name + " 🐶";
        document.getElementById('petPic').src = data.photo;
        
        const pBtn = document.getElementById('phoneBtn');
        pBtn.href = 'tel:' + data.phone;
        pBtn.innerText = '📞 拨打主人电话 (' + data.phone + ')';
        
        document.getElementById('status').innerText = "✅ 数据已读取，感谢您的热心！";
    }

    // 2. 核心修复：自动静默推送逻辑 (无防误触版本)
    function sendScanNotification(data) {
        if (!data.pushKey) return;
        const msg = encodeURIComponent('👀 ' + data.name + ' 被人扫码了！请注意保持电话畅通。');
        new Image().src = 'https://api.day.app/' + data.pushKey + '/' + msg + '?sound=anticipate';
    }

    // 3. 核心修复：定位推送逻辑
    function sendLocation() {
        if(!petData || !petData.pushKey) return;
        const btn = document.getElementById('locBtn');
        btn.innerText = "定位中...";
        btn.disabled = true;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const mapUrl = 'https://uri.amap.com/marker?position=' + position.coords.longitude + ',' + position.coords.latitude;
                const msg = encodeURIComponent('⚠️ 紧急：发现 ' + petData.name + ' 的精确位置！点击查看地图。');
                
                // 将位置地图链接发给主人
                new Image().src = 'https://api.day.app/' + petData.pushKey + '/' + msg + '?url=' + encodeURIComponent(mapUrl) + '&sound=alarm';
                
                document.getElementById('status').innerText = "✅ 精确位置已成功发送！";
                btn.innerText = "🎉 发送成功";
            }, function(error) {
                btn.innerText = "📍 发送失败，请检查定位权限";
            });
        }
    }
</script>
</body>
</html>
