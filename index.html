<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物身份标识</title>
    <style>
        :root {
            --primary-color: #FF8E53;
            --secondary-color: #FF6B6B;
            --text-color: #333;
            --bg-color: #F7F9FC;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            position: relative;
        }
        .loading-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { margin-top: 20px; color: #666; font-size: 16px; }
        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 40px 20px 30px;
            text-align: center;
            color: white;
            position: relative;
        }
        .avatar-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: white;
            padding: 5px;
            margin: 0 auto 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #eee;
        }
        .pet-name { font-size: 26px; font-weight: bold; margin-bottom: 5px; }
        .pet-breed { font-size: 14px; opacity: 0.9; background: rgba(255,255,255,0.2); display: inline-block; padding: 2px 12px; border-radius: 12px; }
        .content { padding: 30px 24px; }
        .info-card {
            background: #F8FAFC;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #E2E8F0;
        }
        .info-item:last-child { border-bottom: none; }
        .info-label { color: #64748B; font-size: 14px; }
        .info-value { font-weight: 600; color: #334155; font-size: 15px; }
        .status-badge {
            background: #DEF7EC;
            color: #03543F;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }
        .status-badge.missing { background: #FDE8E8; color: #9B1C1C; }
        .message-box {
            background: #FFF9DB;
            border-left: 4px solid #FCC419;
            padding: 15px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 25px;
        }
        .message-title { font-weight: bold; color: #665200; font-size: 14px; margin-bottom: 5px; }
        .message-text { color: #856404; font-size: 14px; }
        .btn-contact {
            display: block;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(255,110,110,0.3);
            transition: transform 0.2s;
        }
        .
