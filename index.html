<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物安全防护</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f7f9fc; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 30px; max-width: 400px; margin: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn { display: block; width: 100%; padding: 15px; border-radius: 50px; text-decoration: none; font-weight: bold; margin-top: 15px; border: none; cursor: pointer; }
        .phone-btn { background: #2ecc71; color: white; }
        .loc-btn { background: #3498db; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <img id="petPic" style="width:150px;border-radius:50%;" src="">
        <h1 id="petName">加载中...</h1>
        <a id="phoneBtn" class="btn phone-btn" href="#">拨打主人电话</a>
        <button id="locBtn" class="btn loc-btn" onclick="sendLocation()">获取位置并推送</button>
        <p id="status" style="font-size:12px;color:#999;"></p>
    </div>

<script>
    const petId = new URLSearchParams(window.location.search).get('id') || "SGB001";
    let currentPet = null;

    fetch('data.json?t=' + Date.now())
        .then(res => res.json())
        .then(data => {
            currentPet = data[petId];
            if (currentPet) {
                document.getElementById('petName').innerText = "我是 " + currentPet.name;
                document.getElementById('petPic').src = currentPet.photo;
                document.getElementById('phoneBtn').href = "tel:" + currentPet.phone;
            }
        });

    function sendLocation() {
        const btn = document.getElementById('locBtn');
        btn.innerText = "定位中...";
        
        if (!navigator.geolocation) {
            alert("您的浏览器不支持定位");
            return;
        }

        navigator.geolocation.getCurrentPosition(pos => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            // 使用 encodeURIComponent 确保链接格式正确
            const mapUrl = `https://uri.amap.com/marker?position=${lon},${lat}&name=位置`;
            const pushUrl = `https://api2.pushdeer.com/message/push?pushkey=${currentPet.pushKey}&text=宠物定位&desp=经纬度:${lat},${lon} [查看地图](${mapUrl})`;
            
            // 使用 fetch 发送请求，并捕获错误
            fetch(pushUrl)
                .then(() => { btn.innerText = "已发送通知"; })
                .catch(e => { btn.innerText = "发送失败"; console.error(e); });
        }, err => {
            btn.innerText = "定位失败，请允许权限";
        }, { enableHighAccuracy: true });
    }
</script>
</body>
</html>
