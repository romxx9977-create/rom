<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寵物安全防丟系統</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #fcfbf7; padding: 20px; color: #333; margin: 0; }
        .card { background: #fffdf9; border-radius: 30px; padding: 40px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); max-width: 400px; margin: 20px auto; border: 1px solid #f0eee9; }
        .pet-pic { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #e2e8f0; margin-bottom: 25px; }
        h1 { font-size: 26px; color: #2d3436; margin: 0 0 15px; }
        .msg { color: #636e72; font-size: 15px; line-height: 1.6; margin-bottom: 30px; }
        .btn { display: block; width: 100%; padding: 18px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 17px; margin-top: 15px; border: none; cursor: pointer; transition: transform 0.2s; }
        .phone-btn { background: #6b8e23; color: white; }
        .loc-btn { background: #4a90e2; color: white; }
        .status-box { margin-top: 25px; padding: 10px; background: #e8f5e9; border-radius: 10px; color: #2e7d32; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <img id="petPic" src="" alt="寵物照片" class="pet-pic">
        <h1 id="petName">加載中...</h1>
        <p class="msg">如果您看到了這個頁面，說明我可能迷路了。SOS ⚠️<br>我的主人非常急切，請您幫幫我！</p>
        
        <a id="phoneBtn" class="btn phone-btn" href="#">撥打主人電話</a>
        <button id="locBtn" class="btn loc-btn" onclick="sendLocation()">📍 點擊將我的位置發給主人</button>
        
        <div class="status-box" id="status">⏳ 正在連接雲端數據...</div>
        <p style="font-size: 11px; color: #b2bec3; margin-top: 20px;">💡 提示：本銘牌已激活遠端實時報警。</p>
    </div>

<script>
    const petId = new URLSearchParams(window.location.search).get('id') || "SGB001";
    let petData = null;

    // ==========================================
    // 🌍 核心算法：WGS-84(GPS) 转 GCJ-02(火星坐标系)
    // ==========================================
    const PI = 3.1415926535897932384626;
    const a = 6378245.0;
    const ee = 0.00669342162296594323;

    function wgs84togcj02(lng, lat) {
        if (out_of_china(lng, lat)) {
            return [lng, lat]; 
        }
        let dlat = transformlat(lng - 105.0, lat - 35.0);
        let dlng = transformlng(lng - 105.0, lat - 35.0);
        let radlat = lat / 180.0 * PI;
        let magic = Math.sin(radlat);
        magic = 1 - ee * magic * magic;
        let sqrtmagic = Math.sqrt(magic);
        dlat = (dlat * 180.0) / ((a * (1 - ee)) / (magic * sqrtmagic) * PI);
        dlng = (dlng * 180.0) / (a / sqrtmagic * Math.cos(radlat) * PI);
        return [lng + dlng, lat + dlat]; 
    }

    function transformlat(lng, lat) {
        let ret = -100.0 + 2.0 * lng + 3.0 * lat + 0.2 * lat * lat + 0.1 * lng * lat + 0.2 * Math.sqrt(Math.abs(lng));
        ret += (20.0 * Math.sin(6.0 * lng * PI) + 20.0 * Math.sin(2.0 * lng * PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(lat * PI) + 40.0 * Math.sin(lat / 3.0 * PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(lat / 12.0 * PI) + 320 * Math.sin(lat * PI / 30.0)) * 2.0 / 3.0;
        return ret;
    }

    function transformlng(lng, lat) {
        let ret = 300.0 + lng + 2.0 * lat + 0.1 * lng * lng + 0.1 * lng * lat + 0.1 * Math.sqrt(Math.abs(lng));
        ret += (20.0 * Math.sin(6.0 * lng * PI) + 20.0 * Math.sin(2.0 * lng * PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(lng * PI) + 40.0 * Math.sin(lng / 3.0 * PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(lng / 12.0 * PI) + 300.0 * Math.sin(lng / 30.0 * PI)) * 2.0 / 3.0;
        return ret;
    }

    function out_of_china(lng, lat) {
        return (lng < 72.004 || lng > 137.8347) || (lat < 0.8293 || lat > 55.8271);
    }

    // ==========================================
    // 💾 页面初始化与数据读取
    // ==========================================
    window.onload = () => {
        fetch('data.json?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                petData = data[petId];
                if (petData) {
                    document.getElementById('petName').innerText = "我是 " + petData.name + " 🐶";
                    document.getElementById('petPic').src = petData.photo;
                    document.getElementById('phoneBtn').innerText = `📞 撥打主人電話 (${petData.phone})`;
                    document.getElementById('phoneBtn').href = "tel:" + petData.phone;
                    document.getElementById('status').innerText = "✅ 數據已讀取，感謝您的熱心！";
                    
                    // 自动触发：静默扫码通知（分流路由）
                    if (petData.pushKey) {
                        const title = encodeURIComponent('👀 ' + petData.name + ' 被人掃碼了！');
                        const desp = encodeURIComponent('有熱心人打開了防丟網頁，請注意保持電話暢通。');
                        
                        let pushUrl = "";
                        if (petData.platform === "bark") {
                            pushUrl = `https://api.day.app/${petData.pushKey}/${title}/${desp}?sound=glass.caf&group=Sogobu`;
                        } else {
                            pushUrl = `https://api2.pushdeer.com/message/push?pushkey=${petData.pushKey}&text=${title}&desp=${desp}`;
                        }
                        new Image().src = pushUrl; 
                    }
                } else {
                    document.getElementById('status').innerText = "⚠️ 未找到該寵物信息";
                }
            })
            .catch(err => {
                document.getElementById('status').innerText = "❌ 數據加載失敗";
            });
    };

    // ==========================================
    // 📍 核心事件：获取定位并本地纠偏发送
    // ==========================================
    function sendLocation() {
        const btn = document.getElementById('locBtn');
        if (!petData || !petData.pushKey) {
            btn.innerText = "⚠️ 未配置推送 Key";
            return;
        }

        btn.innerText = "正在獲取定位...";
        
        navigator.geolocation.getCurrentPosition(pos => {
            const rawLat = pos.coords.latitude;
            const rawLon = pos.coords.longitude;
            
            // 🚀 在前端本地将原生 GPS 坐标转换为国内火星坐标（高德/苹果地图通用）
            const [gcjLon, gcjLat] = wgs84togcj02(rawLon, rawLat);
            
            const title = encodeURIComponent('⚠️ 緊急：' + petData.name + ' 的實時位置');
            let pushUrl = "";

            if (petData.platform === "bark") {
                // 【Bark 路由】传入纠偏后的坐标，支持 iOS 锁屏界面直接滑动拉起原生系统地图
                const body = encodeURIComponent(`實時精確位置已鎖定`);
                const mapUrl = encodeURIComponent(`https://maps.apple.com/?q=${gcjLat},${gcjLon}`);
                pushUrl = `https://api.day.app/${petData.pushKey}/${title}/${body}?url=${mapUrl}&sound=alarm.caf&group=Sogobu`;
            } else {
                // 【PushDeer 路由】使用干净的高德 H5 链接，规避任何内置浏览器的强行拦截
                const mapUrl = `https://uri.amap.com/marker?position=${gcjLon},${gcjLat}&name=${encodeURIComponent('寵物當前位置')}`;
                const despText = `[點擊此處打開地圖查看位置](${mapUrl})\n\n若上方無法點擊，請直接點選下方藍色鏈接：\n${mapUrl}`;
                const desp = encodeURIComponent(despText);
                pushUrl = `https://api2.pushdeer.com/message/push?pushkey=${petData.pushKey}&text=${title}&desp=${desp}&type=markdown`;
            }
            
            // 使用 Image 跨域空发，绕过广告拦截插件的 fetch CORS 拦截
            new Image().src = pushUrl;
            
            setTimeout(() => {
                btn.innerText = "✅ 位置已發送！";
                btn.style.backgroundColor = "#27ae60";
            }, 500);

        }, () => {
            btn.innerText = "❌ 獲取失敗，請檢查手機定位權限";
        }, { enableHighAccuracy: true }); // 强制手机调用高精度 GPS 硬件
    }
</script>
</body>
</html>
