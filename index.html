<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>宠物信息</title>
</head>
<body>
    <h1 id="pName">正在读取...</h1>
    <p>主人电话: <span id="pPhone"></span></p >
    <script>
        const ID = new URLSearchParams(window.location.search).get('id');
        fetch(`https://api.jsonbin.io/v3/b/${ID}/latest`, {
            headers: { 'X-Access-Key': '$2a$10$ifFU3oUE7yOAkZ3JnQ0zHek4A5BDXNO3c3blR8nKSyJwmEIo/Zjc6' }
        })
        .then(res => res.json())
        .then(data => {
            const p = data.record;
            document.getElementById('pName').innerText = p.petName || '无名';
            document.getElementById('pPhone').innerText = p.petPhone || '无电话';
        })
        .catch(() => {
            document.getElementById('pName').innerText = '读取失败';
        });
    </script>
</body>
</html>
