<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宠物安全防护</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; background: #fcfbf7; padding: 20px; }
        .card { background: #fffdf9; border-radius: 30px; padding: 30px; max-width: 400px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid #f0eee9; }
        .pet-pic { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { font-size: 24px; color: #2d3436; margin: 10px 0; }
        .btn { display: block; width: 100%; padding: 16px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 16px; border: none; cursor: pointer; margin-top: 15px; }
        .phone-btn { background: #6b8e23; color: white; }
        .loc-btn { background: #4a90e2; color: white; }
        .footer { font-size: 12px; color: #b2bec3; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <img id="petPic" class="pet-pic" src="" alt="宠物照片">
        <h1 id="petName">载入中...</h1>
        <p>如果您看到我，说明我迷路了。请联系主人！</p>
        
        <a id="phoneBtn" class="btn phone-btn" href="#">拨打主人电话</a>
        <button id="locBtn" class="btn loc-btn" onclick="sendLocation()">📍 点击将我的位置发给主人</button>
        
        <p id="status" class="footer">✅ 数据已读取，感谢您的热心！</p>
    </div>

<script>
    const petId = new URLSearchParams(window.location.search).get('id') || "SGB001";
    let petData = null;

    // 1. 获取数据
    fetch('data.json?t=' + Date.now())
        .then(res => res.json())
        .then(data => {
            petData = data[petId];
            if (petData) {
                document.getElementById('petName').innerText = "我是 " + petData.name + " 🐶";
                document.getElementById('petPic').src = petData.photo;
                document.getElementById('phoneBtn').href = "tel:" + petData.phone;
            }
        });

    // 2. 获取并发送定位
    function sendLocation() {
        const btn = document.getElementById('locBtn');
        if (!petData) return;
        
        btn.innerText = "定位中...";
        btn.disabled = true;

        navigator.geolocation.getCurrentPosition(pos => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const mapUrl = `https://uri.amap.com/marker?position=${lon},${lat}&name=位置`;
            const pushUrl = `https://api2.pushdeer.com/message/push?pushkey=${petData.pushKey}&text=宠物定位&desp=经纬度:${lat},${lon} [地图链接](${mapUrl})`;
            
            fetch(pushUrl)
                .then(() => { btn.innerText = "✅ 位置已发送！"; })
                .catch(() => { btn.innerText = "⚠️ 发送失败"; });
        }, () => {
            btn.innerText = "❌ 定位失败，请允许权限";
            btn.disabled = false;
        }, { enableHighAccuracy: true });
    }
</script>
</body>
</html>
