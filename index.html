<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宠物安全防丢系统</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #fcfbf7; padding: 20px; color: #333; margin: 0; }
        .card { background: #fffdf9; border-radius: 30px; padding: 40px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); max-width: 400px; margin: 20px auto; border: 1px solid #f0eee9; }
        .pet-pic { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #e2e8f0; margin-bottom: 25px; }
        h1 { font-size: 26px; color: #2d3436; margin: 0 0 15px; }
        .msg { color: #636e72; font-size: 15px; line-height: 1.6; margin-bottom: 30px; }
        .btn { display: block; width: 100%; padding: 18px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 17px; margin-top: 15px; border: none; cursor: pointer; transition: transform 0.2s; }
        .phone-btn { background: #6b8e23; color: white; }
        .loc-btn { background: #4a90e2; color: white; }
        .status-box { margin-top: 25px; padding: 10px; background: #e8f5e9; border-radius: 10px; color: #2e7d32; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <img id="petPic" src="" alt="宠物照片" class="pet-pic">
        <h1 id="petName">加载中...</h1>
        <p class="msg">如果您看到了这个页面，说明我可能迷路了。SOS ⚠️<br>我的主人非常急切，请您帮帮我！</p>
        
        <a id="phoneBtn" class="btn phone-btn" href="#">拨打主人电话</a>
        <button id="locBtn" class="btn loc-btn" onclick="sendLocation()">📍 点击将我的位置发给主人</button>
        
        <div class="status-box" id="status">⏳ 正在连接云端数据...</div>
        <p style="font-size: 11px; color: #b2bec3; margin-top: 20px;">💡 提示：本铭牌已激活远端实时报警。</p>
    </div>

<script>
    const petId = new URLSearchParams(window.location.search).get('id') || "SGB001";
    let petData = null;

    window.onload = () => {
        fetch('data.json?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                petData = data[petId];
                if (petData) {
                    // 1. 渲染页面
                    document.getElementById('petName').innerText = "我是 " + petData.name + " 🐶";
                    document.getElementById('petPic').src = petData.photo;
                    document.getElementById('phoneBtn').innerText = `📞 拨打主人电话 (${petData.phone})`;
                    document.getElementById('phoneBtn').href = "tel:" + petData.phone;
                    document.getElementById('status').innerText = "✅ 数据已读取，感谢您的热心！";
                    
                    // 2. 发送静默扫码通知 (完全修正为 PushDeer 接口)
                    if (petData.pushKey) {
                        const title = encodeURIComponent('👀 ' + petData.name + ' 被人扫码了！');
                        const desp = encodeURIComponent('有热心人打开了防丢网页，请注意保持电话畅通。');
                        const pushUrl = `https://api2.pushdeer.com/message/push?pushkey=${petData.pushKey}&text=${title}&desp=${desp}`;
                        fetch(pushUrl).catch(e => console.log("静默推送失败"));
                    }
                } else {
                    document.getElementById('status').innerText = "⚠️ 未找到该宠物信息";
                }
            })
            .catch(err => {
                document.getElementById('status').innerText = "❌ 数据加载失败";
            });
    };

    function sendLocation() {
        const btn = document.getElementById('locBtn');
        if (!petData || !petData.pushKey) {
            btn.innerText = "⚠️ 未配置推送 Key";
            return;
        }

        btn.innerText = "正在获取定位...";
        
        navigator.geolocation.getCurrentPosition(pos => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            
            // 构造高德地图跳转链接
            const mapUrl = `https://uri.amap.com/marker?position=${lon},${lat}&name=走失宠物位置&callnative=1`;
            const title = encodeURIComponent('⚠️ 紧急：' + petData.name + ' 的实时位置');
            const desp = encodeURIComponent(`经纬度: ${lat},${lon} \n\n[点击此处打开地图查看位置](${mapUrl})`);
            
            // 修正为 PushDeer 接口，并添加 markdown 类型以支持链接点击
            const pushUrl = `https://api2.pushdeer.com/message/push?pushkey=${petData.pushKey}&text=${title}&desp=${desp}&type=markdown`;
            
            fetch(pushUrl).then(() => {
                btn.innerText = "✅ 位置已发送！";
                btn.style.backgroundColor = "#27ae60";
            }).catch(() => {
                btn.innerText = "❌ 网络错误，发送失败";
            });
        }, () => {
            btn.innerText = "❌ 获取失败，请检查手机定位权限";
        }, { enableHighAccuracy: true });
    }
</script>
</body>
</html>
