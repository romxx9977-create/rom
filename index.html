<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>宠物信息</title>
</head>
<body>
    <h1 id="pName">正在读取数据...</h1>
    <p>主人电话: <span id="pPhone"></span></p >

    <script>
        const API_KEY = '$2a$10$ifFU3oUE7yOAkZ3JnQ0zHek4A5BDXNO3c3blR8nKSyJwmEIo/Zjc6';
        const urlParams = new URLSearchParams(window.location.search);
        const binId = urlParams.get('id');

        if (binId) {
            fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                headers: { 'X-Access-Key': API_KEY }
            })
            .then(res => res.json())
            .then(data => {
                const p = data.record;
                document.getElementById('pName').innerText = p.petName || '无名';
                document.getElementById('pPhone').innerText = p.petPhone || '无电话';
            })
            .catch(() => {
                document.getElementById('pName').innerText = '读取失败';
            });
        } else {
            document.getElementById('pName').innerText = '缺少ID参数';
        }
    </script>
</body>
</html>
