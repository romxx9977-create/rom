<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寵物防丟資訊</title>
    <style>
        body { text-align: center; font-family: sans-serif; padding: 20px; }
        #petPic { width: 200px; height: 200px; object-fit: cover; border-radius: 50%; border: 3px solid #ddd; margin-bottom: 20px; }
        .btn { display: block; width: 80%; margin: 15px auto; padding: 15px; font-size: 18px; border-radius: 10px; border: none; text-decoration: none; color: white; }
    </style>
</head>
<body>
    <img id="petPic" src="" alt="寵物照片">
    <h1 id="name">載入中...</h1>
    
    <a id="phoneBtn" class="btn" style="background-color: #007bff;" href="#">☎️ 撥打主人電話</a>
    
    <button class="btn" style="background-color: #28a745;" onclick="openMap()">📍 獲取我的位置並導航</button>
    
    <p id="status"></p>

    <script>
        async function loadData() {
            const params = new URLSearchParams(window.location.search);
            const binId = params.get('id');
            const status = document.getElementById('status');

            if (!binId) {
                status.innerText = "❌ 未檢測到有效的元件 ID";
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`);
                const json = await res.json();
                const data = json.record;

                document.getElementById('name').innerText = data.name || "未命名";
                document.getElementById('petPic').setAttribute('src', data.photo || "");
                document.getElementById('phoneBtn').setAttribute('href', "tel:" + data.phone);
            } catch (e) {
                status.innerText = "❌ 讀取失敗，請確認 ID 是否正確";
            }
        }

        function openMap() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        // 打开 Google Maps 导航
                        window.location.href = `https://www.google.com/maps/dir/?api=1&destination=${latitude},${longitude}`;
                    },
                    () => alert("無法獲取位置，請確保已授權定位權限。")
