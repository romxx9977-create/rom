<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物防丢安全铭牌</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f7f9fc; padding: 20px; color: #333; margin: 0; }
        .card { background: white; border-radius: 20px; padding: 30px; max-width: 420px; margin: 20px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .pet-pic { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; color: #2c3e50; margin: 10px 0; }
        .p-text { color: #57606f; line-height: 1.6; }
        .phone-btn { display: flex; align-items: center; justify-content: center; background: #2ecc71; color: white; padding: 15px; text-decoration: none; border-radius: 30px; font-weight: bold; font-size: 18px; margin-top: 25px; box-shadow: 0 4px 12px rgba(46,204,113,0.3); }
        .phone-btn.disabled { background: #cbd5e1; box-shadow: none; pointer-events: none; }
        #locBtn { display: block; width: 100%; background: #3498db; color: white; border: none; padding: 15px; border-radius: 30px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; }
        #status-text { font-size: 12px; color: #a4b0be; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <img id="petPic" src="" alt="宠物照片" class="pet-pic">
    <h1>我是 [ <span id="petName">载入中...</span> ] 🐶</h1>
    <p class="p-text">如果您看到了这个页面，说明我可能迷路了。<br>我的主人非常急切，请您帮帮我！</p>
    
    <a id="phoneBtn" href="javascript:void(0);" class="phone-btn disabled">📞 暂无主人电话</a>
    <button id="locBtn" onclick="sendLocation()">📍 点击将我的位置发给主人</button>
    <p id="status-text">💡 正在全力载入云端防丢数据...</p>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const BIN_ID = urlParams.get('id');
    let petData = null;

    window.onload = function() {
        if (!BIN_ID) {
            document.getElementById('status-text').innerText = "⚠️ 错误：未绑定该元件 ID！";
            return;
        }
        loadRemoteData();
    };

    function loadRemoteData() {
        fetch('data.json?nocache=' + Date.now())
            .then(res => res.json())
            .then(data => {
                petData = data[BIN_ID];
                if (petData) {
                    renderDisplayPage();
                } else {
                    document.getElementById('status-text').innerText = "❌ 读取错误：未找到该宠物信息";
                }
            })
            .catch(err => {
                document.getElementById('status-text').innerText = "❌ 读取错误：请检查 data.json";
            });
    }

    function renderDisplayPage() {
        document.getElementById('petName').innerText = petData.name || "未命名";
        
        if (petData.photo) {
            document.getElementById('petPic').src = petData.photo;
        }
        
        if (petData.phone) {
            const pBtn = document.getElementById('phoneBtn');
            pBtn.href = 'tel:' + petData.phone;
            pBtn.innerText = '📞 拨打主人电话 (' + petData.phone + ')';
            pBtn.classList.remove('disabled');
        }
        
        // 核心修改：如果是 SGB 开头的 ID，启用 Bark 定位推送功能
        if (BIN_ID.startsWith('SGB') && petData.pushKey) {
            document.getElementById('status-text').innerText = "💡 开启 GPS 位置权限，系统将自动通知主人。";
            sendLoadNotification(); // 加载即发送一个“已被扫码”静默推送
        }
    }

    function sendLoadNotification() {
        // 静默推送：不干扰用户，只通知主人铭牌被触动了
        const title = encodeURIComponent('👀 您的宠物 ' + petData.name + ' 被人扫码了！');
        const body = encodeURIComponent('好心人已打开网页，请注意保持电话畅通。');
        new Image().src = 'https://api.day.app/' + petData.pushKey + '/' + title + '/' + body + '?sound=anticipate';
    }

    function sendLocation() {
        if(!petData.pushKey) return;
        const btn = document.getElementById('locBtn');
        btn.innerText = "正在精确保位获取位置...";
        btn.disabled = true;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const mapUrl = 'https://maps.apple.com/?ll=' + position.coords.latitude + ',' + position.coords.longitude;
                const title = encodeURIComponent('⚠️ 紧急：发现 ' + petData.name + ' 的实时位置！');
                const body = encodeURIComponent('点击本通知即可在地图中导航前往该位置。');
                
                // 将位置地图链接发给主人
                new Image().src = 'https://api.day.app/' + petData.pushKey + '/' + title + '/' + body + '?url=' + encodeURIComponent(mapUrl) + '&sound=alarm';
                
                document.getElementById('status-text').innerText = "✅ 精确位置已成功发送！感谢您的热心帮助！";
                btn.innerText = "🎉 发送成功";
            }, function(error) {
                btn.innerText = "📍 发送失败，请检查定位权限";
            }, { enableHighAccuracy: true });
        }
    }
</script>
</body>
</html>
