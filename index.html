<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寵物防丟資訊</title>
    <style>
        body { text-align: center; font-family: sans-serif; padding: 20px; }
        #petPic { width: 200px; height: 200px; object-fit: cover; border-radius: 50%; border: 3px solid #ddd; }
    </style>
</head>
<body>
    <img id="petPic" src="" alt="寵物照片">
    <h1 id="name">載入中...</h1>
    <p>主人電話: <span id="phone"></span></p>
    <p id="status"></p>

    <script>
        async function loadData() {
            const params = new URLSearchParams(window.location.search);
            const binId = params.get('id');
            const status = document.getElementById('status');

            if (!binId) {
                status.innerText = "❌ 錯誤：未提供有效的元件 ID";
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`);
                if (!res.ok) throw new Error("讀取資料失敗");
                const json = await res.json();
                const data = json.record;

                document.getElementById('name').innerText = data.name || "未命名";
                document.getElementById('phone').innerText = data.phone || "無";
                document.getElementById('petPic').setAttribute('src', data.photo || "");
            } catch (e) {
                status.innerText = "❌ 資料讀取失敗，請確認 ID 是否正確";
            }
        }
        loadData();
    </script>
</body>
</html>
