<script>
    // 定义全局变量存储读取到的数据
    let currentPet = null;

    window.onload = () => {
        fetch('data.json?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                const petId = new URLSearchParams(window.location.search).get('id') || "SGB001";
                currentPet = data[petId]; // 动态获取该 ID 对应的宠物对象
                
                if (currentPet) {
                    document.getElementById('petName').innerText = "我是 " + currentPet.name + " 🐶";
                    document.getElementById('petPic').src = currentPet.photo;
                    document.getElementById('phoneBtn').innerText = `📞 拨打主人电话 (${currentPet.phone})`;
                    document.getElementById('phoneBtn').href = "tel:" + currentPet.phone;
                }
            })
            .catch(err => console.error("数据加载失败:", err));
    };

    function sendLocation() {
        if (!currentPet || !currentPet.pushKey) {
            alert("未找到该宠物的推送配置信息");
            return;
        }

        const btn = document.getElementById('locBtn');
        btn.innerText = "正在获取定位...";
        
        navigator.geolocation.getCurrentPosition(pos => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            
            const mapUrl = `https://uri.amap.com/marker?position=${lon},${lat}&name=走失宠物位置&callnative=1`;
            const title = encodeURIComponent('⚠️ 紧急：' + currentPet.name + ' 的实时位置');
            const desp = encodeURIComponent(`经纬度: ${lat},${lon} \n\n[点击此处打开地图查看位置](${mapUrl})`);
            
            // 使用读取到的动态 Key
            const pushUrl = `https://api2.pushdeer.com/message/push?pushkey=${currentPet.pushKey}&text=${title}&desp=${desp}&type=markdown`;
            
            fetch(pushUrl)
                .then(res => {
                    btn.innerText = "✅ 位置已发送！";
                    btn.style.backgroundColor = "#27ae60";
                })
                .catch(err => {
                    btn.innerText = "❌ 发送失败，请重试";
                });
        }, () => {
            btn.innerText = "❌ 请手动开启定位权限";
        }, { enableHighAccuracy: true });
    }
</script>
