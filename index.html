<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物安全防丢系统</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f6f8; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 30px; max-width: 400px; margin: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .pet-pic { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 5px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .phone-btn { display: block; background: #2ecc71; color: white; padding: 15px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <img id="petPic" class="pet-pic" src="" alt="宠物照片">
        <h1 id="petName">加载中...</h1>
        <p>我迷路了，请联系我的主人！</p>
        <a id="phoneBtn" class="phone-btn" href="#">拨打主人电话</a>
        <p id="status" style="font-size: 12px; color: #999; margin-top: 20px;"></p>
    </div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const petId = urlParams.get('id');

    window.onload = () => {
        if (!petId) return;
        
        fetch('data.json?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                const pet = data[petId];
                if (pet) {
                    document.getElementById('petName').innerText = "我是 " + pet.name;
                    document.getElementById('petPic').src = pet.photo;
                    document.getElementById('phoneBtn').href = "tel:" + pet.phone;
                    document.getElementById('status').innerText = "系统已激活，正在为您守护";
                    
                    // 自动触发通知，无需交互
                    if (pet.pushKey) {
                        fetch(`https://api2.pushdeer.com/message/push?pushkey=${pet.pushKey}&text=${encodeURIComponent('⚠️ ' + pet.name + ' 被人扫码了！')}&desp=${encodeURIComponent('扫描时间：' + new Date().toLocaleString())}`);
                    }
                }
            });
    };
</script>
</body>
</html>
