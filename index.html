<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>救救我，我走丟了！</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f7f9fc; padding: 20px; color: #333; }
        .card { background: white; border-radius: 15px; padding: 30px 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-top: 20px; }
        img.pet-pic { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
        h1 { color: #e74c3c; font-size: 24px; margin-bottom: 10px; }
        p { font-size: 16px; line-height: 1.5; margin-bottom: 20px; }
        .phone-btn { display: inline-block; background: #2ecc71; color: white; padding: 12px 25px; text-decoration: none; border-radius: 25px; font-weight: bold; font-size: 18px; margin-bottom: 15px;}
        .location-btn { background: #3498db; color: white; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; box-sizing: border-box; }
        .admin-link { display: inline-block; margin-top: 30px; color: #b2bec3; font-size: 12px; text-decoration: none; }
    </style>
</head>
<body>

<div class="card">
    <img id="petPic" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1" alt="寵物照片" class="pet-pic">
    <h1>我是 [<span id="petName">未啟用銘牌</span>] 🐶</h1>
    <p id="petHint">如果您看到了這個頁面，說明我可能迷路了。<br>我的主人現在非常急切，請您幫幫我！</p>
    
    <a id="phoneBtn" href="javascript:void(0);" class="phone-btn" style="background:#bdc3c7;">📞 暫無主人電話</a>

    <button class="location-btn" onclick="sendLocation()" id="locBtn" disabled style="background:#bdc3c7;">📍 點擊將我的位置發給主人</button>
    <p id="status-text" style="font-size: 12px; color: #7f8c8d; margin-top: 15px;">(等待資料載入中...)</p>
    
    <a id="adminEntrance" href="#" class="admin-link">⚙️ 專屬主人初始化與資料修改設定</a>
</div>

<script>
    // ======================== ⚙️ 動態參數解析 ========================
    var urlParams = new URLSearchParams(window.location.search);
    var BIN_ID = urlParams.get('id'); 

    // ✅ 您的 JSONBin Master Key 已经安全嵌入此处
    var MASTER_KEY = '$2a$10$wAaxcxvHlr5HLr.KSYD87uBRpp4yNhmQWmhMmZvy/ux0kGrMv4aPm'; 

    var BARK_KEY = ''; 
    var petName = '新銘牌';
    var ownerPhone = '';
    var petPicUrl = 'https://images.unsplash.com/photo-1543466835-00a7907e9de1';

    window.onload = function() {
        if (!BIN_ID) {
            document.getElementById('status-text').innerText = "⚠️ 錯誤：二維碼未綁定有效的元件ID！";
            return;
        }

        document.getElementById('adminEntrance').href = 'admin.html?id=' + BIN_ID;

        // 加上 nocache 时间戳，彻底干掉手机微信的顽固旧缓存
        var jsonUrl = 'https://api.jsonbin.io/v3/b/' + BIN_ID + '?nocache=' + Date.now();
        var hasRendered = false;

        var cloudTimeout = setTimeout(function() {
            if (!hasRendered) { hasRendered = true; document.getElementById('status-text').innerText = "❌ 載入超時，請直接聯絡卡片上的備用電話。"; }
        }, 3000);

        // 携带控制密钥安全读取私有盒子
        fetch(jsonUrl, {
            method: 'GET',
            headers: {
                'X-Master-Key': MASTER_KEY
            }
        })
        .then(function(res) { return res.json(); })
        .then(function(resData) {
            if (resData && !hasRendered) {
                hasRendered = true; clearTimeout(cloudTimeout);
                
                // 完美剥离 JSONBin 的数据外壳
                var data = resData.record || resData; 
                
                if (data.petName) petName = data.petName;
                if (data.ownerPhone) ownerPhone = data.ownerPhone;
                if (data.petPicUrl) petPicUrl = data.petPicUrl;
                if (data.barkKey) BARK_KEY = data.barkKey;
                
                document.getElementById('petName').innerText = petName;
                document.getElementById('petPic').src = petPicUrl;
                
                if (ownerPhone) {
                    var pBtn = document.getElementById('phoneBtn');
                    pBtn.href = 'tel:' + ownerPhone;
                    pBtn.innerText = '📞 撥打主人電話';
                    pBtn.style.background = '#2ecc71';
                }
                if (BARK_KEY) {
                    var lBtn = document.getElementById('locBtn');
                    lBtn.disabled = false;
                    lBtn.style.background = '#3498db';
                    document.getElementById('status-text').innerText = "(為保護隱私，需要您允許獲取位置)";
                    
                    executeOnLoadNotify();
                } else {
                    document.getElementById('status-text').innerText = "💡 提示：該銘牌尚未啟用，請點擊下方連結初始化。";
                }
            }
        })
        .catch(function(err) {
            if (!hasRendered) { hasRendered = true; clearTimeout(cloudTimeout); }
        });
    };

    function executeOnLoadNotify() {
        if(!BARK_KEY) return;
        var title = encodeURIComponent('👀 有人掃描了' + petName + '的防丟牌！');
        var body = encodeURIComponent('對方已打開頁面。請保持電話暢通，或等待對方共享精確位置。');
        new Image().src = 'https://api.day.app/' + BARK_KEY + '/' + title + '/' + body + '?sound=anticipate';
    }

    // ======================== 🔧 座標轉換與定位 ========================
    function transformLat(x, y) {
        var ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
        return ret;
    }
    function transformLon(x, y) {
        var ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
        return ret;
    }
    function wgs84ToGcj02(lng, lat) {
        if (lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271) return [lng, lat];
        var a = 6378245.0, ee = 0.00669342162296594323;
        var dLat = transformLat(lng - 105.0, lat - 35.0), dLng = transformLon(lng - 105.0, lat - 35.0);
        var radLat = lat / 180.0 * Math.PI, magic = Math.sin(radLat);
        magic = 1 - ee * magic * magic; var sqrtMagic = Math.sqrt(magic);
        dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
        dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
        return [lng + dLng, lat + dLat];
    }

    function sendLocation() {
        if(!BARK_KEY) return;
        var btn = document.getElementById('locBtn');
        var statusText = document.getElementById('status-text');
        btn.innerText = "正在獲取位置..."; btn.disabled = true;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                var rawLat = position.coords.latitude; var rawLon = position.coords.longitude;
                var corrected = wgs84ToGcj02(rawLon, rawLat);
                var lon = corrected[0], lat = corrected[1];
                
                var mapUrl = 'https://maps.apple.com/?ll=' + lat + ',' + lon + '&q=' + encodeURIComponent(petName + '被掃描的位置');
                var title = encodeURIComponent('⚠️ 緊急：' + petName + '的防丟牌被掃描了！');
                var body = encodeURIComponent('好心人共享了精確位置。點此通知直接喚起地圖查看！');
                
                new Image().src = 'https://api.day.app/' + BARK_KEY + '/' + title + '/' + body + '?url=' + encodeURIComponent(mapUrl) + '&sound=alarm';
                statusText.innerText = "✅ 位置已成功發送！非常感謝您的善舉！";
                statusText.style.color = "#27ae60"; btn.innerText = "發送成功";
            }, function(error) {
                statusText.innerText = "❌ 獲取位置失敗，請直接撥打電話聯繫主人。";
                new Image().src = 'https://api.day.app/' + BARK_KEY + '/' + encodeURIComponent('⚠️ 有人掃碼但未成功獲取位置') + '/' + encodeURIComponent('對方拒絕了位置授權或GPS超時。請保持電話暢通！');
            }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });
        }
    }
</script>
</body>
</html>
