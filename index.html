 <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物资料</title>
    <style>
        body { font-family: sans-serif; background: #f7f9fc; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 400px; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
        .info-item { margin: 15px 0; padding: 10px 0; border-bottom: 1px solid #eee; }
        .label { font-weight: bold; color: #555; }
        .btn-contact { display: block; background: #FF8E53; color: white; text-align: center; padding: 15px; border-radius: 10px; text-decoration: none; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="petName">载入中...</h2>
    <div class="info-item"><span class="label">品种:</span> <span id="petBreed"></span></div>
    <div class="info-item"><span class="label">状态:</span> <span id="petStatus"></span></div>
    <div class="info-item"><span class="label">寄语:</span> <p id="petNotice"></p ></div>
    <a id="btnContact" class="btn-contact" href=" ">拨打主人电话</a >
</div>

<script>
    const API_KEY = '$2a$10$ifFU3oUE7yOAkZ3JnQ0zHek4A5BDXNO3c3blR8nKSyJwmEIo/Zjc6';
    
    async function loadData() {
        const urlParams = new URLSearchParams(window.location.search);
        const binId = urlParams.get('id');
        if (!binId) {
            document.getElementById('petName').innerText = "未找到宠物ID";
            return;
        }

        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                headers: { 'X-Access-Key': API_KEY }
            });
            const data = await res.json();
            const p = data.record;
            
            document.getElementById('petName').innerText = p.petName || '无名';
            document.getElementById('petBreed').innerText = p.petBreed || '未知';
            document.getElementById('petStatus').innerText = p.petStatus || '正常';
            document.getElementById('petNotice').innerText = p.petNotice || '无';
            document.getElementById('btnContact').href = `tel:${p.petPhone}`;
        } catch (e) {
            document.getElementById('petName').innerText = "读取失败";
        }
    }
    loadData();
</script>
</body>
</html>
