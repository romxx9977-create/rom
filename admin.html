<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物信息管理后台</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #4CAF50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="tel"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 80px; resize: none; }
        button { width: 100%; padding: 12px; background-color: #4CAF50; border: none; color: white; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #45a049; }
        .loading { display: none; text-align: center; font-weight: bold; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>修改宠物信息</h2>
    <div class="form-group">
        <label for="binIdInput">请输入您的 宠物 Bin ID:</label>
        <input type="text" id="binIdInput" placeholder="例如: 65cb123445..." onchange="loadPetData()">
    </div>
    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
    
    <form id="petForm" onsubmit="updatePetData(event)" disabled>
        <div class="form-group">
            <label for="petName">宠物昵称:</label>
            <input type="text" id="petName" required>
        </div>
        <div class="form-group">
            <label for="petBreed">宠物品种:</label>
            <input type="text" id="petBreed" required>
        </div>
        <div class="form-group">
            <label for="petGender">性别:</label>
            <select id="petGender">
                <option value="公">公 (Boy)</option>
                <option value="母">母 (Girl)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="petAge">年龄:</label>
            <input type="text" id="petAge" placeholder="例如: 2岁 / 3个月">
        </div>
        <div class="form-group">
            <label for="petPhone">主人联系电话:</label>
            <input type="tel" id="petPhone" required>
        </div>
        <div class="form-group">
            <label for="petStatus">状态:</label>
            <select id="petStatus">
                <option value="正常">健康安全</option>
                <option value="已走失">寻宠中（紧急）</option>
            </select>
        </div>
        <div class="form-group">
            <label for="petNotice">主人寄语 / 寻宠启事:</label>
            <textarea id="petNotice" placeholder="写一些宠物特点，或者给好心人的话..."></textarea>
        </div>
        <div class="form-group">
            <label for="petAvatar">头像图片链接 (可选):</label>
            <input type="text" id="petAvatar" placeholder="输入图片网络URL">
        </div>
        <button type="submit" id="submitBtn">保存并更新信息</button>
    </form>
    <div id="loadingText" class="loading">正在处理中...</div>
</div>

<script>
    const CONFIG = {
        API_KEY: '$2a$10$ifFU3oUE7yOAkZ3JnQ0zHek4A5BDXNO3c3blR8nKSyJwmEIo/Zjc6'
    };

    // 页面加载时尝试自动从URL中读取ID
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if(id) {
            document.getElementById('binIdInput').value = id;
            loadPetData();
        }
    }

    async function loadPetData() {
        const binId = document.getElementById('binIdInput').value.trim();
        if (!binId) return;

        const loadingText = document.getElementById('loadingText');
        loadingText.innerText = "正在读取原宠物数据...";
        loadingText.style.display = "block";

        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                method: 'GET',
                headers: { 'X-Access-Key': CONFIG.API_KEY }
            });

            if (!response.ok) throw new Error('未能找到该ID对应的数据');

            const resData = await response.json();
            const pet = resData.record;

            // 填充表单
            document.getElementById('petName').value = pet.name || '';
            document.getElementById('petBreed').value = pet.breed || '';
            document.getElementById('petGender').value = pet.gender || '公';
            document.getElementById('petAge').value = pet.age || '';
            document.getElementById('petPhone').value = pet.phone || '';
            document.getElementById('petStatus').value = pet.status || '正常';
            document.getElementById('petNotice').value = pet.notice || '';
            document.getElementById('petAvatar').value = pet.avatar || '';

            loadingText.style.display = "none";
        } catch (error) {
            alert('读取失败: ' + error.message);
            loadingText.style.display = "none";
        }
    }

    async function updatePetData(event) {
        event.preventDefault();
        const binId = document.getElementById('binIdInput').value.trim();
        if (!binId) {
            alert('请输入完整的 Bin ID');
            return;
        }

        const loadingText = document.getElementById('loadingText');
        const submitBtn = document.getElementById('submitBtn');
        
        loadingText.innerText = "正在上传并更新到云端...";
        loadingText.style.display = "block";
        submitBtn.disabled = true;

        const updatedData = {
            name: document.getElementById('petName').value,
            breed: document.getElementById('petBreed').value,
            gender: document.getElementById('petGender').value,
            age: document.getElementById('petAge').value,
            phone: document.getElementById('petPhone').value,
            status: document.getElementById('petStatus').value,
            notice: document.getElementById('petNotice').value,
            avatar: document.getElementById('petAvatar').value
        };

        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Access-Key': CONFIG.API_KEY
                },
                body: JSON.stringify(updatedData)
            });

            if (!response.ok) throw new Error('更新失败，请检查Key权限或ID是否正确');

            alert('🎉 更新成功！手机扫描二维码或刷新展示页即可看到最新数据。');
        } catch (error) {
            alert('提交失败: ' + error.message);
        } finally {
            loadingText.style.display = "none";
            submitBtn.disabled = false;
        }
    }
</script>
</body>
</html>
