<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寵物管理後台</title>
    <style>
        body { font-family: sans-serif; background-color: #f7f9fc; padding: 20px; color: #333; }
        .card { background: white; border-radius: 15px; padding: 25px 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: 20px auto; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #34495e; }
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 12px; margin-bottom: 18px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        input[type="file"] { margin-bottom: 15px; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; transition: background 0.2s; }
        .btn-load { background: #3498db; color: white; }
        .btn-load:hover { background: #2980b9; }
        .btn-save { background: #2ecc71; color: white; }
        .btn-save:hover { background: #27ae60; }
        hr { border: 0; height: 1px; background: #eee; margin: 20px 0; }
        .hint { font-size: 12px; color: #7f8c8d; margin-top: -10px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🐾 寵物智能銘牌管理後台</h2>
    
    <label>JSONBin Bin ID</label>
    <input type="text" id="binId" placeholder="請輸入 24 位元件 ID">

    <label>JSONBin Master Key</label>
    <input type="password" id="masterKey" placeholder="請輸入最高管理密鑰 (Master Key)">
    
    <div class="btn-group">
        <button class="btn-load" onclick="loadRemoteData()">🔄 第一步：點此載入雲端資料</button>
    </div>

    <hr>

    <label>寵物名字</label>
    <input type="text" id="petName" placeholder="例如：abu">

    <label>主人手機號碼</label>
    <input type="text" id="ownerPhone" placeholder="例如：137XXXXXXXX">

    <label>寵物照片 (直接選擇文件上傳)</label>
    <input type="file" id="imageInput" accept="image/*" onchange="convertImageToBase64()">
    <textarea id="petPicUrl" placeholder="照片數據代碼（選擇圖片後會自動生成）" style="height: 60px;" readonly></textarea>
    <div class="hint">💡 提示：手機拍照體積較大，上傳前請先截圖或壓縮，控制在 100KB 以內。</div>

    <label>Bark Key (通知金鑰)</label>
    <input type="text" id="barkKey" placeholder="請輸入您的 Bark App 金鑰">
    <div class="hint">💡 用於有人掃碼時，主動發送推播通知與精確定位到您的 iPhone。</div>

    <button class="btn-save" onclick="saveDataToCloud()">🟢 第二步：點此保存修改</button>
</div>

<script>
    // 頁面載入時，自動從網址解析 ?id=xxxx 並填入輸入框
    window.onload = function() {
        var urlParams = new URLSearchParams(window.location.search);
        var idParam = urlParams.get('id');
        if (idParam) {
            document.getElementById('binId').value = idParam;
        }
    };

    // 本地圖片轉 Base64 邏輯
    function convertImageToBase64() {
        var file = document.getElementById('imageInput').files[0];
        if (!file) return;
        
        var reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('petPicUrl').value = e.target.result;
            alert("✅ 照片轉換完成！請記得點擊下方綠色按鈕保存修改。");
        };
        reader.readAsDataURL(file);
    }

    // 載入資料
    async function loadRemoteData() {
        var id = document.getElementById('binId').value.trim();
        var key = document.getElementById('masterKey').value.trim();
        
        if (!id || !key) {
            alert("❌ 請先填寫 Bin ID 和 Master Key 才能載入資料！");
            return;
        }

        try {
            var response = await fetch(`https://api.jsonbin.io/v3/b/${id}/latest`, {
                method: 'GET',
                headers: { 'X-Master-Key': key }
            });
            
            if (!response.ok) throw new Error("驗證失敗，請檢查 ID 或 Key 是否正確");
            
            var resData = await response.json();
            var data = resData.record || resData;

            document.getElementById('petName').value = data.petName || "";
            document.getElementById('ownerPhone').value = data.ownerPhone || "";
            document.getElementById('petPicUrl').value = data.petPicUrl || "";
            document.getElementById('barkKey').value = data.barkKey || "";
            
            alert("✅ 雲端資料載入成功！現在可以開始修改。");
        } catch (e) {
            alert("❌ 載入失敗：" + e.message);
        }
    }

    // 保存資料
    async function saveDataToCloud() {
        var id = document.getElementById('binId').value.trim();
        var key = document.getElementById('masterKey').value.trim();
        
        if (!id || !key) {
            alert("❌ 請填寫 Bin ID 和 Master Key 才能進行保存！");
            return;
        }

        var bodyData = {
            petName: document.getElementById('petName').value.trim(),
            ownerPhone: document.getElementById('ownerPhone').value.trim(),
            petPicUrl: document.getElementById('petPicUrl').value.trim(),
            barkKey: document.getElementById('barkKey').value.trim()
        };

        try {
            var response = await fetch(`https://api.jsonbin.io/v3/b/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': key
                },
                body: JSON.stringify(bodyData)
            });

            if (response.ok) {
                alert("🎉 保存成功！防丟牌資料已同步至雲端。");
            } else {
                alert("❌ 保存失敗，請確認 Key 權限或網絡狀況。");
            }
        } catch (e) {
            alert("❌ 發生錯誤：" + e.message);
        }
    }
</script>

</body>
</html>
