<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理後台</title>
</head>
<body>
    <h2>寵物資料管理</h2>
    <input type="text" id="name" placeholder="寵物名字" style="width:90%; padding:8px;"><br><br>
    <input type="text" id="phone" placeholder="電話" style="width:90%; padding:8px;"><br><br>
    
    <label>選擇照片 (會自動轉為數據代碼):</label><br>
    <input type="file" id="imageInput" accept="image/*" onchange="convert()">
    <textarea id="photo" placeholder="照片數據" style="width:90%; height:60px; margin-top:5px;"></textarea><br><br>
    
    <button onclick="save()" style="padding:10px 20px; background:green; color:white; border:none;">💾 保存修改</button>
    
    <hr>
    <h3>進階設定</h3>
    <input type="text" id="binId" placeholder="JSONBin Bin ID" style="width:90%; padding:8px;"><br><br>
    <input type="password" id="masterKey" placeholder="Master Key (安全性輸入)" style="width:90%; padding:8px;"><br><br>
    <button onclick="load()">🔄 載入當前雲端資料</button>

    <script>
        // 自動載入 ID
        const params = new URLSearchParams(window.location.search);
        document.getElementById('binId').value = params.get('id') || "";

        function convert() {
            const file = document.getElementById('imageInput').files[0];
            const reader = new FileReader();
            reader.onload = (e) => document.getElementById('photo').value = e.target.result;
            reader.readAsDataURL(file);
        }

        async function save() {
            const id = document.getElementById('binId').value;
            const key = document.getElementById('masterKey').value;
            const data = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                photo: document.getElementById('photo').value
            };
            const res = await fetch(`https://api.jsonbin.io/v3/b/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': key },
                body: JSON.stringify(data)
            });
            res.ok ? alert("保存成功！") : alert("保存失敗，請檢查 Key");
        }

        async function load() {
            const id = document.getElementById('binId').value;
            const key = document.getElementById('masterKey').value;
            const res = await fetch(`https://api.jsonbin.io/v3/b/${id}/latest`, {
                headers: { 'X-Master-Key': key }
            });
            const data = await res.json();
            document.getElementById('name').value = data.record.name;
            document.getElementById('phone').value = data.record.phone;
            document.getElementById('photo').value = data.record.photo;
        }
    </script>
</body>
</html>
